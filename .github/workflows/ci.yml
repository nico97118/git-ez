name: checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          python-version: '3.11'
          enable-cache: true
      - name: Sync runtime and lint dependencies
        run: uv sync --locked --no-default-groups --group lint
      - name: Ruff lint
        run: uv run --locked --no-default-groups --group lint ruff check .
      - name: Ruff format check
        run: uv run --locked --no-default-groups --group lint ruff format --check .
      - name: Mypy type check
        run: uv run --locked --no-default-groups --group lint mypy src
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Exercise Python bounds and both operating systems on every PR/main push.
      matrix: ${{ fromJSON(
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
        && '{"os":["ubuntu-latest","macos-latest"],"python":["3.11","3.12","3.13","3.14"]}'
        || '{"include":[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.14"}]}'
        ) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync runtime and test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Unit tests
        id: unit
        run: >-
          uv run --locked --no-default-groups --group test pytest -v -m unit --cov --cov-report=
          --junitxml=ci-reports/unit.xml
      - name: Integration tests and combined coverage
        id: integration
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: >-
          uv run --locked --no-default-groups --group test pytest -v -m integration --cov --cov-append
          --cov-report=term-missing
          --cov-report=json:ci-reports/coverage.json
          --cov-report=xml:ci-reports/coverage.xml
          --cov-report=html:ci-reports/coverage-html
          --junitxml=ci-reports/integration.xml
      - name: Preserve test and coverage reports
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-reports/
          retention-days: 14
  packages:
    name: Packages (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
        && '{"os":["ubuntu-latest","macos-latest"],"python":["3.11","3.12","3.13","3.14"]}'
        || '{"include":[{"os":"ubuntu-latest","python":"3.11"},{"os":"macos-latest","python":"3.14"}]}'
        ) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Ensure a manual viewer is available
        if: runner.os == 'Linux'
        run: |
          if ! command -v man >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes man-db
          fi
      - name: Sync runtime dependencies
        run: uv sync --locked --no-default-groups
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/git-ez-temp"
          ln -s "$RUNNER_TEMP/git-ez-temp" "$RUNNER_TEMP/git-ez-temp-alias"
          TMPDIR="$RUNNER_TEMP/git-ez-temp-alias" uv run --locked --no-default-groups python scripts/check_install.py dist/git_ez_ai-*.whl
