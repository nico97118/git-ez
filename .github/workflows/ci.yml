name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Ensure a manual viewer is available
        if: runner.os == 'Linux'
        run: |
          if ! command -v man >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes man-db
          fi
      - run: uv sync --locked
      - name: Unit tests
        id: unit
        run: >-
          uv run --locked pytest -v -m unit --cov --cov-report=
          --junitxml=ci-reports/unit.xml
      - name: Integration tests and combined coverage
        id: integration
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: >-
          uv run --locked pytest -v -m integration --cov --cov-append
          --cov-report=term-missing
          --cov-report=json:ci-reports/coverage.json
          --cov-report=xml:ci-reports/coverage.xml
          --cov-report=html:ci-reports/coverage-html
          --junitxml=ci-reports/integration.xml
      - name: Preserve test and coverage reports
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-reports/
          retention-days: 14
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv build
      - name: Verify installed wheel outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/git-ez-temp"
          ln -s "$RUNNER_TEMP/git-ez-temp" "$RUNNER_TEMP/git-ez-temp-alias"
          TMPDIR="$RUNNER_TEMP/git-ez-temp-alias" uv run --locked python scripts/check_install.py dist/git_ez_ai-*.whl
