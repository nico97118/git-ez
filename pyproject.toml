[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "git-ez-ai"
version = "0.1.0"
description = "Local Git rebase/merge with traceable AI conflict resolution"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "deepagents==0.7.41",
    "langchain-openai==1.8.5",
    "langchain-ollama==1.1.0",
    "langgraph-checkpoint==4.3.2",
]

[project.scripts]
git-ez = "git_ez.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.1",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.8",
]
lint = ["ruff>=0.9", "mypy>=1.14"]
dev = [{include-group = "test"}, {include-group = "lint"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: isolated behavior without Git subprocesses, model runtimes, or network services",
    "integration: real Git, SDK/runtime integration, local HTTP/TLS, or installed CLI",
]

[tool.coverage.run]
source = ["git_ez"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.hatch.build.targets.wheel]
packages = ["src/git_ez"]

[tool.hatch.build.targets.wheel.shared-data]
"docs/man/git-ez.1" = "share/man/man1/git-ez.1"

[tool.hatch.build.targets.sdist]
include = ["/src/git_ez", "/tests", "/examples", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/docs", "/scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
